<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordForge</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd5;--accent:#c4813a;--accent2:#d95f5f;--accent3:#4a9e7a;--purple:#7c6fd4;--text:#1c1814;--text2:#6b6358;--text3:#a8a099;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:-.5px}
.logo em{color:var(--accent);font-style:italic}
.hstats{display:flex;align-items:center;gap:10px}
.stat-chip{font-size:13px;font-weight:600;color:var(--text2)}
.stat-chip b{font-family:'DM Mono',monospace;color:var(--accent)}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;gap:0}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:600;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'DM Sans',sans-serif}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:20px;max-width:680px;margin:0 auto}
.page{display:none}.page.on{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.goal-card{background:var(--accent);color:#fff;border-radius:20px;padding:16px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.goal-num{font-family:'Instrument Serif',serif;font-size:36px;line-height:1}
.goal-label{font-size:11px;opacity:.8;margin-top:2px}
.goal-bar-wrap{height:4px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:6px;width:100px}
.goal-bar-fill{height:100%;background:#fff;border-radius:4px;transition:width .4s}
.section-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.topic-grid{display:grid;gap:10px}
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center}
.topic-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(196,129,58,.1)}
.topic-emoji{font-size:24px;margin-bottom:4px}
.topic-name{font-family:'Instrument Serif',serif;font-size:20px}
.topic-meta{font-size:12px;color:var(--text3);margin-top:3px}
.ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace}
.back-btn{background:none;border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.unit-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.unit-title{font-family:'Instrument Serif',serif;font-size:18px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px;margin-bottom:14px}
.qcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:100px}
.badge-mc{background:rgba(124,111,212,.12);color:var(--purple);border:1px solid rgba(124,111,212,.25)}
.badge-fi{background:rgba(196,129,58,.12);color:var(--accent);border:1px solid rgba(196,129,58,.25)}
.badge-sent{background:rgba(124,111,212,.12);color:var(--purple);border:1px solid rgba(124,111,212,.25)}
.speak-btn{background:none;border:1px solid var(--border);border-radius:100px;color:var(--text3);padding:5px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;transition:all .2s}
.speak-btn:hover{border-color:var(--accent);color:var(--accent)}
.pdots{display:flex;gap:5px;margin-bottom:14px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.pdot.done{background:var(--accent3)}
.pdot.active{background:var(--accent)}
.word-hint{font-size:12px;color:var(--text3);margin-bottom:6px}
.sent-box{background:var(--surface2);border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.7;color:var(--text2);margin-bottom:18px;border-left:3px solid var(--border)}
.blank{display:inline-block;background:var(--border);border-radius:5px;min-width:65px;height:19px;vertical-align:middle;position:relative;top:-1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.opt{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;cursor:pointer;font-size:14px;font-weight:500;text-align:left;color:var(--text);transition:all .2s;font-family:'DM Sans',sans-serif}
.opt:hover{border-color:var(--accent);background:rgba(196,129,58,.05)}
.opt.correct{border-color:var(--accent3);background:rgba(74,158,122,.08);color:var(--accent3)}
.opt.wrong{border-color:var(--accent2);background:rgba(217,95,95,.08);color:var(--accent2)}
.opt-zh{display:block;font-size:11px;color:var(--text3);margin-top:3px;font-weight:400}
.opt.correct .opt-zh{color:var(--accent3)}.opt.wrong .opt-zh{color:var(--accent2)}
.fi-wrap{display:flex;gap:8px;margin-bottom:8px}
.fi-input{flex:1;background:transparent;border:none;border-bottom:2px solid var(--border);padding:10px 4px;font-size:17px;font-family:'DM Mono',monospace;color:var(--text);outline:none;transition:border-color .2s}
.fi-input:focus{border-color:var(--accent)}
.fi-input.correct{border-color:var(--accent3)}.fi-input.wrong{border-color:var(--accent2)}
.check-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s}
.check-btn:hover{opacity:.85}.check-btn:disabled{opacity:.35;cursor:not-allowed}
.hint-row{display:flex;gap:8px;margin-top:8px}
.hint-btn,.skip-btn{flex:1;border-radius:10px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border);background:var(--surface2);transition:all .2s}
.hint-btn{color:var(--accent);border-color:rgba(196,129,58,.3)}.hint-btn:disabled{opacity:.4;cursor:not-allowed}
.skip-btn{color:var(--accent2);border-color:rgba(217,95,95,.3)}
.feedback{font-size:13px;margin-top:10px;min-height:18px;font-weight:500;line-height:1.6}
.feedback.ok{color:var(--accent3)}.feedback.bad{color:var(--accent2)}
.sent-zh-reveal{font-size:13px;color:var(--text2);margin-top:8px;padding:10px 14px;background:var(--surface2);border-radius:10px;border-left:3px solid var(--accent3);display:none;line-height:1.6}
.mastered-banner{background:var(--accent3);color:#fff;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px;font-weight:600;display:none}
.mastered-banner.show{display:block}
.next-btn{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:13px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;display:none;margin-top:10px;font-family:'DM Sans',sans-serif}
.next-btn:hover{border-color:var(--accent);color:var(--accent)}.next-btn.show{display:block}
.score-pop{position:fixed;top:66px;right:14px;z-index:200;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--accent);transform:translateX(120%);transition:transform .3s;pointer-events:none;font-family:'DM Mono',monospace}
.score-pop.show{transform:translateX(0)}
.jigsaw-slots{min-height:46px;border:2px dashed var(--border);border-radius:12px;padding:9px 11px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:10px;background:var(--surface2);transition:border-color .2s}
.jigsaw-tokens{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.token{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:14px;cursor:pointer;user-select:none;transition:all .2s;color:var(--text)}
.token:hover{border-color:var(--purple);background:rgba(124,111,212,.06)}
.token.placed{background:rgba(124,111,212,.1);border-color:var(--purple);color:var(--purple)}
.slot-token{background:rgba(124,111,212,.1);border:1px solid var(--purple);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--purple);display:inline-flex;align-items:center;gap:3px;transition:all .2s}
.slot-token:hover{background:rgba(217,95,95,.1);border-color:var(--accent2);color:var(--accent2)}
.insert-gap{display:inline-flex;align-items:center;justify-content:center;width:18px;height:26px;color:var(--border);font-size:12px;cursor:pointer;border-radius:4px;transition:all .2s;border:1px solid transparent;user-select:none}
.insert-gap:hover,.insert-gap.active{background:rgba(124,111,212,.15);color:var(--purple);border-color:var(--purple)}
.token.correct-token{background:rgba(74,158,122,.12);border-color:var(--accent3);color:var(--accent3)}
.token.wrong-token{background:rgba(217,95,95,.1);border-color:var(--accent2);color:var(--accent2)}
.sent-typing{width:100%;background:transparent;border:none;border-bottom:2px solid var(--border);padding:10px 4px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;resize:none;min-height:70px;transition:border-color .2s;line-height:1.6}
.sent-typing:focus{border-color:var(--purple)}.sent-typing.correct{border-color:var(--accent3)}.sent-typing.wrong{border-color:var(--accent2)}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.wcard{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px;position:relative;cursor:pointer;transition:all .2s}
.wcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.wcard-en{font-weight:700;font-size:13px;margin-bottom:3px}
.wcard-zh{font-size:11px;color:var(--text2)}
.wcard-type{font-size:10px;color:var(--text3);margin-top:4px;font-weight:600;letter-spacing:.7px;text-transform:uppercase}
.mdot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%}
.m0{background:var(--border)}.m1{background:#f0a500}.m2{background:#f0a500}.m3,.m4{background:var(--accent3)}
.sent-item{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 15px;margin-bottom:9px}
.sent-item.mastered{border-color:var(--accent3)}
.sent-item-en{font-size:14px;line-height:1.6;margin-bottom:4px}
.sent-item-zh{font-size:12px;color:var(--text3)}
.sent-item-meta{font-size:10px;color:var(--text3);margin-top:5px;font-weight:600}
.complete-card{text-align:center;padding:50px 20px}
.complete-card h2{font-family:'Instrument Serif',serif;font-size:28px;color:var(--accent3);margin-bottom:8px}
.complete-card p{color:var(--text2);font-size:14px;margin-bottom:20px}
select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;cursor:pointer}
@media(max-width:480px){.opts{grid-template-columns:1fr}.word-grid{grid-template-columns:1fr 1fr}.tab-btn{padding:10px 10px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="logo">Word<em>Forge</em></div>
  <div class="hstats">
    <span class="stat-chip">⚡ <b id="hScore">0</b></span>
    <span class="stat-chip">🔥 <b id="hStreak">0</b></span>
  </div>
</header>
<div class="tab-bar">
  <button class="tab-btn on" onclick="switchTab('practice',this)">Practice</button>
  <button class="tab-btn" onclick="switchTab('words',this)">Word Bank</button>
  <button class="tab-btn" onclick="switchTab('sentences',this)">Sentences</button>
</div>
<div class="score-pop" id="scorePop"></div>
<main>
  <div class="page on" id="page-practice">
    <div id="topicListView">
      <!-- Stats row at top -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center">
          <div style="font-family:'DM Mono',monospace;font-size:17px;font-weight:700;color:var(--accent3)" id="statAccNum">—</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">Accuracy</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center">
          <div style="font-family:'DM Mono',monospace;font-size:17px;font-weight:700;color:var(--purple)" id="statNewWords">0</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">Words mastered</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center">
          <div style="font-family:'DM Mono',monospace;font-size:17px;font-weight:700;color:var(--accent)" id="statNewSents">0</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">Sents mastered</div>
        </div>
      </div>
      <div class="section-label">Choose a Unit</div>
      <div class="topic-grid" id="topicGrid"></div>
    </div>
    <div id="practiceView" style="display:none">
      <!-- Word progress bar shown during practice -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:14px">📝</span>
            <span style="font-size:13px;font-weight:600;color:var(--text2)">Today's Words</span>
          </div>
          <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700">
            <span id="wordDoneNum" style="color:var(--accent)">0</span>
            <span style="color:var(--text3)"> / 30</span>
          </div>
        </div>
        <div style="height:10px;background:var(--surface2);border-radius:100px;overflow:hidden">
          <div id="wordBar" style="height:100%;background:linear-gradient(90deg,var(--accent),#e8a04a);border-radius:100px;width:0%;transition:width .5s ease"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px">
          <div style="font-size:11px;color:var(--text3)" id="todayDateLabel"></div>
          <div style="font-size:11px;color:var(--accent);font-weight:600" id="wordGoalStatus"></div>
        </div>
      </div>
      <div class="unit-header">
        <button class="back-btn" onclick="backToTopics()">← Units</button>
        <div class="unit-title" id="practiceUnitName"></div>
      </div>
      <div id="practiceArea"></div>
    </div>
  </div>
  <div class="page" id="page-words">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'Instrument Serif',serif;font-size:20px">Word Bank</div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="wbSel" onchange="renderWB()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;cursor:pointer"><option value="all">All Units</option></select>
        <button onclick="startWordQuiz()" style="background:var(--purple);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap">🎯 Quiz</button>
      </div>
    </div>
    <!-- Word Quiz Area -->
    <div id="wordQuizArea" style="display:none;margin-bottom:20px"></div>
    <div class="word-grid" id="wordGrid"></div>
  </div>
  <div class="page" id="page-sentences">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'Instrument Serif',serif;font-size:20px">Sentences</div>
      <select id="sentSel" onchange="initSentTab()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;cursor:pointer"><option value="all">All Units</option></select>
    </div>
    <!-- Sentence daily progress bar -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:14px">🧩</span>
          <span style="font-size:13px;font-weight:600;color:var(--text2)">Today's Sentences</span>
        </div>
        <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700">
          <span id="sentDoneNum" style="color:var(--purple)">0</span>
          <span style="color:var(--text3)"> / 20</span>
        </div>
      </div>
      <div style="height:10px;background:var(--surface2);border-radius:100px;overflow:hidden">
        <div id="sentBar" style="height:100%;background:linear-gradient(90deg,var(--purple),#a89be8);border-radius:100px;width:0%;transition:width .5s ease"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        <div style="font-size:11px;color:var(--text3)" id="sentTabDateLabel"></div>
        <div style="font-size:11px;color:var(--purple);font-weight:600" id="sentGoalStatus"></div>
      </div>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">Arrange words in the correct order. Tap ⬩ to insert between words.</div>
    <div id="sentPracticeArea"></div>
    <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">All Sentences</div>
      <div id="sentListArea"></div>
    </div>
  </div>
</main>
<script>
const UNITS=[{id:'inspiration',name:'Inspiration',emoji:'✨',words:[
{w:'counselor',zh:'顧問；輔導員',type:'n',ex:'The person who influenced me most is my high school counselor.',exZh:'對我影響最深的是我的高中輔導員。'},
{w:'inner thoughts',zh:'內心想法',type:'phrase',ex:'He helped me gain a deeper understanding of my personality and inner thoughts.',exZh:'他幫助我更深入地了解自己的個性和內心想法。'},
{w:'have a huge influence on',zh:'對...有巨大影響',type:'phrase',ex:'Role models have a huge influence on the way young people think.',exZh:'榜樣對年輕人的思維方式有巨大的影響。'},
{w:'step out of my comfort zone',zh:'走出舒適圈',type:'phrase',ex:'His story encouraged me to step out of my comfort zone and try new things.',exZh:'他的故事鼓勵我走出舒適圈，嘗試新事物。'},
{w:'realize my potential',zh:'發揮潛力',type:'phrase',ex:'She always believed I could realize my potential if I worked hard enough.',exZh:'她始終相信只要我足夠努力就能發揮自己的潛力。'},
{w:'change my perspective on life',zh:'改變我對生活的看法',type:'phrase',ex:'Traveling alone completely changed my perspective on life.',exZh:'獨自旅行徹底改變了我對生活的看法。'},
{w:'set a good example for others',zh:'為他人樹立好榜樣',type:'phrase',ex:'My parents set a good example for others through their kindness and hard work.',exZh:'我的父母以善良和努力為他人樹立了好榜樣。'},
{w:'look up to someone',zh:'仰慕某人',type:'phrase',ex:'I have always looked up to my father for his patience and dedication.',exZh:'我一直仰慕我父親的耐心和奉獻精神。'},
{w:'make a lasting impression on me',zh:'給我留下深刻印象',type:'phrase',ex:'His kindness made a lasting impression on me that I still carry today.',exZh:'他的善意給我留下了深刻的印象，至今仍銘記於心。'},
{w:'drive',zh:'幹勁；驅動力',type:'n',ex:'What I admire most about her is her incredible drive to keep improving.',exZh:'我最欣賞她的就是她不斷進步的驚人幹勁。'},
{w:'perseverance',zh:'毅力；堅持不懈',type:'n',ex:'His perseverance in the face of failure is what makes him truly inspiring.',exZh:'他面對失敗時的堅持不懈才是他真正令人鼓舞的地方。'},

],sentences:[
{en:'The person who has influenced me the most in my life is my high school counselor.',zh:'在我生命中對我影響最深的人是我的高中輔導員。'},
{en:'He led me to explore my interests and helped me gain a deeper understanding of my personality and inner thoughts.',zh:'他引導我探索自己的興趣，並幫助我更深入地了解自己的個性和內心想法。'},
{en:"Throughout my growth, I've been inspired by many people — it could be my family, classmates, or even a book or a movie.",zh:'在我成長的過程中，許多人給了我啟發——可能是家人、同學，甚至是一本書或一部電影。'},
{en:'I truly admire his drive and perseverance.',zh:'我真心欽佩他的幹勁和毅力。'},
{en:'What I admire most about him is his incredible drive and perseverance.',zh:'我最欽佩他的是他令人難以置信的幹勁和毅力。'},
{en:"Whenever he sets a goal, he never gives up until it's achieved.",zh:'每當他設定一個目標，他從不放棄，直到實現為止。'},
{en:'My father is incredibly responsible, single-handedly shouldering all of our household expenses.',zh:'我父親極其負責任，靠一己之力承擔所有家庭開銷。'},

{en:'Together, they truly set a wonderful example for us.',zh:'他們共同為我們樹立了一個美好的榜樣。'},
{en:'I have a friend named Karen who has inspired me tremendously.',zh:'我有一位名叫Karen的朋友，她極大地激勵了我。'},
{en:'She is always driven, passionate, and highly proactive in everything she does.',zh:'她在做任何事情上都充滿動力、熱情，且高度積極主動。'},
{en:'I truly hope to learn from her and emulate her positive traits.',zh:'我真心希望向她學習，並效仿她的優點。'},
{en:"When I'm in need of guidance, I usually turn to my close friends.",zh:'當我需要指引時，我通常會向親近的朋友求助。'},
{en:"They know me inside out, so through our conversations, I'm always able to sort through my thoughts and clear my mind.",zh:'他們對我了如指掌，所以通過我們的對話，我總能整理思緒、清醒頭腦。'},
{en:'If I had to choose one public figure who has the most profound influence on me, it would definitely be the late Steve Jobs.',zh:'如果我必須選一位對我影響最深遠的公眾人物，那肯定是已故的史蒂夫·賈伯斯。'},
{en:'He is globally renowned as a tech visionary, most notably for inventing the iPhone.',zh:'他以科技遠見者的身份享譽全球，最著名的是發明了iPhone。'},
{en:'What made a lasting impression on me was how he was once removed from his company, but he never gave up.',zh:'讓我印象深刻的是，他曾被自己的公司解僱，但他從未放棄。'},
{en:'His story truly changed my perspective on life — it encouraged me to step out of my comfort zone and push myself to improve.',zh:'他的故事真正改變了我對生活的看法——它鼓勵我走出舒適圈，督促自己不斷進步。'},
{en:'He proved that success is achieved through hard work and self-discipline.',zh:'他證明了成功是通過努力和自律實現的。'},
{en:'Because of his incredible drive and perseverance, I will always look up to him.',zh:'因為他令人難以置信的幹勁和毅力，我將永遠仰慕他。'},
{en:'I think role models have a significant influence on people because they can encourage others to emulate their positive traits.',zh:'我認為榜樣對人們有著重要的影響，因為他們能鼓勵他人效仿其優點。'},
{en:'My father carried most of the responsibilities while we were growing up.',zh:'在我們成長的過程中，父親承擔了大部分的責任。'},
{en:'My mother showed incredible resilience by taking care of many aspects of our lives and supporting the family.',zh:'我母親通過照料我們生活的方方面面並支持家庭，展現了令人難以置信的韌性。'},
{en:'Seeing their dedication and sacrifices has motivated me to become more responsible and hardworking.',zh:'看到他們的奉獻和犧牲，激勵了我變得更有責任感和更加勤奮。'},
{en:'Not only young people but everyone needs inspiration, especially when facing adversities in life.',zh:'不僅是年輕人，每個人都需要激勵，尤其是在面對人生逆境時。'},
{en:'We need something that can motivate us, allowing us to reflect on ourselves and realize our potential.',zh:'我們需要一些能激勵我們的東西，讓我們得以反思自己、發揮潛力。'},
{en:'I think parents usually have a stronger influence on children when they are young.',zh:'我認為父母通常在孩子年幼時對他們有更強的影響力。'},
{en:'Once children start going to school, teachers and classmates begin to influence their behavior and way of thinking.',zh:'一旦孩子開始上學，老師和同學就開始影響他們的行為和思維方式。'},
{en:'Some people become famous because of negative actions rather than positive contributions to society.',zh:'有些人因負面行為而出名，而非對社會的正面貢獻。'},
{en:'People should think critically and form their own judgement rather than imitate celebrities blindly.',zh:'人們應該批判性地思考，形成自己的判斷，而不是盲目模仿名人。'},
{en:'I think international sport events can inspire people because they stimulate passion and unity among individuals.',zh:'我認為國際體育賽事能激勵人們，因為它們激發個人之間的熱情與團結。'},
{en:'When people support their national team, they feel proud of their country and share the same excitement with others.',zh:'當人們支持自己的國家隊時，他們為國家感到自豪，並與他人分享同樣的興奮之情。'},
]},

{en:'In my opinion, achieving a lasting sense of contentment requires clear goals.',zh:'我認為，實現持久的滿足感需要明確的目標。'},

{en:'I need to achieve my target IELTS score and dedicate time to prepare.',zh:'我需要達到目標雅思分數，並投入時間備考。'},
{en:'Accomplishing this goal will give me a deep sense of fulfillment.',zh:'完成這個目標將給我帶來深層的成就感。'},
{en:"There's no denying that the media has influenced people's spending habits.",zh:'不可否認，媒體影響了人們的消費習慣。'},
{en:'People are constantly exposed to other individuals\' lavish lifestyles.',zh:'人們不斷接觸到他人奢華的生活方式。'},
{en:'There are countless advertisements that can easily persuade consumers.',zh:'有數不清的廣告可以輕易說服消費者。'},

{en:'I save 30% of my income and set aside 40% for living expenses.',zh:'我存下30%的收入，並撥出40%用於生活開銷。'},

{en:"The best value-for-money purchase I've ever made is my pet rabbit.",zh:'我買過的最超值的東西是我的寵物兔。'},
{en:'He only cost me about 10 dollars, which was a bargain.',zh:'他只花了我大約10美元，真的非常划算。'},
{en:'The joy and companionship he brings me are truly priceless.',zh:'他帶給我的快樂和陪伴是真正無價的。'},
{en:'His companionship far exceeds his monetary value.',zh:'他的陪伴遠遠超過了他的金錢價值。'},
{en:'I reckon saving is crucial, particularly when invested in stocks or mutual funds.',zh:'我認為儲蓄至關重要，尤其是投資於股票或共同基金時。'},
{en:'The power of compound interest over time is absolutely astonishing.',zh:'複利隨時間累積的力量是絕對令人驚嘆的。'},
{en:"Money might not buy happiness directly, but it provides security and options.",zh:'金錢可能無法直接購買幸福，但它提供了安全感和選擇。'},
{en:"It's a powerful tool that makes pursuing happiness a lot easier.",zh:'它是一個讓追求幸福變得容易得多的強大工具。'},
{en:'Modern society is incredibly materialistic.',zh:'現代社會極度物質主義。'},

{en:'Self-care is one of my top priorities.',zh:'自我照顧是我最優先考慮的事項之一。'},
{en:'Buying things for myself is far more emotionally rewarding.',zh:'為自己購買東西在情感上更有回報。'},
{en:'It serves as a form of stress relief and encourages me to work harder.',zh:'它是一種減壓方式，並鼓勵我更努力工作。'},
{en:'I used to buy things impulsively for instant gratification.',zh:'我以前習慣衝動購物以獲得即時滿足。'},
{en:"As I've become more mature, I prefer to save for urgent needs.",zh:'隨著我變得更成熟，我更傾向於為緊急需求存錢。'},

{en:'She once told me it gives her a deep sense of emotional satisfaction.',zh:'她曾告訴我，這給了她深深的情感滿足感。'},
{en:'Genuinely helping others and spending on them brings her immense joy.',zh:'真誠地幫助他人並為他們花錢給她帶來巨大的快樂。'},
{en:'I walked into an unassuming pet shop near my campus.',zh:'我走進了校園附近一家低調的寵物店。'},
{en:'My attention was drawn to a tiny black-and-white rabbit.',zh:'我的注意力被一隻小小的黑白兔子吸引住了。'},
{en:'Unlike the others, this little guy stood out in the cage.',zh:'與其他兔子不同，這個小傢伙在籠子裡非常顯眼。'},
{en:'He was being bullied and literally stepped on by the others.',zh:'他正在被其他兔子欺負，甚至被踩踏。'},
{en:'I felt compassionate and decided to bring him home.',zh:'我感到同情，決定把他帶回家。'},
{en:"Even though he was a bargain, I've spent dozens of times his price on him.",zh:'雖然他很便宜，但我在他身上花的錢是他價格的幾十倍。'},
{en:'Watching him grow gives me a huge sense of accomplishment.',zh:'看著他成長給了我巨大的成就感。'},
{en:'The companionship and happiness he provides are truly priceless.',zh:'他提供的陪伴和快樂是真正無價的。'},
{en:'Having him around is incredibly therapeutic.',zh:'有他在身邊極具療癒效果。'},
]},
{id:'spare_plans',name:'Spare Time & Plans',emoji:'⏰',words:[
{w:'in my spare time',zh:'在我的空閒時間',type:'phrase',ex:'In my spare time, I enjoy reading books and listening to podcasts.',exZh:'在我的空閒時間，我喜歡閱讀書籍和聆聽播客。'},
{w:'unwind',zh:'放鬆；舒緩',type:'v',ex:'After a long day, I unwind by watching classic movies at home.',exZh:'漫長的一天後，我藉由在家看經典電影來放鬆。'},
{w:'kill time mindlessly',zh:'漫無目的地打發時間',type:'phrase',ex:'I used to kill time mindlessly scrolling through social media.',exZh:'我以前習慣漫無目的地刷社交媒體打發時間。'},
{w:'manage my time effectively',zh:'有效管理時間',type:'phrase',ex:'I have to manage my time effectively to find any gaps for relaxation.',exZh:'我必須有效管理時間，才能找到任何放鬆的空檔。'},
{w:'take a break from work',zh:'從工作中休息',type:'phrase',ex:'Young people are increasingly seeking quiet places to take a break from work.',exZh:'年輕人越來越多地尋求安靜的地方從工作中休息。'},
{w:'absolutely crucial',zh:'絕對關鍵的',type:'phrase',ex:'Getting enough rest is absolutely crucial to staying productive in the long run.',exZh:'獲得足夠的休息對於長期保持生產力絕對關鍵。'},
{w:'productive',zh:'有生產力的',type:'adj',ex:'Making use of fragmented time throughout the day keeps me feeling productive.',exZh:'充分利用一天中的碎片化時間讓我感到有生產力。'},
{w:'perfect balance',zh:'完美的平衡',type:'phrase',ex:'It is all about finding a perfect balance between chasing goals and enjoying life.',exZh:'這一切都是關於在追求目標和享受生活之間找到完美的平衡。'},
{w:'enrich myself',zh:'充實自己',type:'phrase',ex:'I prefer to enrich myself during spare time by learning something new.',exZh:'我更喜歡在空閒時間通過學習新事物來充實自己。'},
{w:'fragmented time',zh:'碎片化時間',type:'phrase',ex:'I always make use of fragmented time to review vocabulary or listen to podcasts.',exZh:'我總是利用碎片化時間複習詞彙或聆聽播客。'},
{w:'recharge my batteries',zh:'恢復精力',type:'phrase',ex:'I need some solitude on weekends to recharge my batteries.',exZh:'我需要在週末獨處一段時間來恢復精力。'},
{w:'solitude',zh:'獨處',type:'n',ex:'I am a person who genuinely needs solitude to feel calm and focused.',exZh:'我是一個真正需要獨處才能感到平靜和專注的人。'},
{w:'well-spent',zh:'花得值得的',type:'adj',ex:'These small moments of relaxation make my time feel well-spent and meaningful.',exZh:'這些小小的放鬆時刻讓我的時間感覺花得值得且有意義。'},
{w:'make plans in advance',zh:'提前規劃',type:'phrase',ex:'I am a firm believer that making plans in advance is essential for success.',exZh:'我堅定地相信提前規劃對成功至關重要。'},
{w:'prioritize tasks',zh:'優先處理任務',type:'phrase',ex:'Having a clear schedule helps me prioritize tasks and stay organized.',exZh:'有清晰的時間表幫助我優先處理任務並保持有條理。'},
{w:'procrastination',zh:'拖延',type:'n',ex:'Procrastination is my biggest weakness when it comes to long-term projects.',exZh:'在長期項目方面，拖延是我最大的弱點。'},
{w:'staying on track',zh:'保持正軌',type:'phrase',ex:'Laziness and procrastination often prevent me from staying on track.',exZh:'懶惰和拖延常常阻止我保持正軌。'},
{w:'regroup',zh:'重整旗鼓',type:'v',ex:'When things go wrong, I take a breath, regroup, and adjust my plan.',exZh:'當事情出錯時，我深呼吸、重整旗鼓，然後調整計畫。'},
{w:'travel itineraries',zh:'旅行行程',type:'phrase',ex:'Among all types of plans, travel itineraries are my most successful ones.',exZh:'在所有類型的計畫中，旅行行程是我最成功的。'},
{w:'sense of accomplishment',zh:'成就感',type:'phrase',ex:'Completing every task on my list gives me a great sense of accomplishment.',exZh:'完成清單上的每項任務給了我巨大的成就感。'},
{w:'executed',zh:'執行；實施',type:'v',ex:'When everything is executed perfectly as planned, the satisfaction is incredible.',exZh:'當一切都按計畫完美執行時，那種滿足感令人難以置信。'},
{w:'roadmap',zh:'路線圖；規劃藍圖',type:'n',ex:'As a planner, I always have a clear roadmap for both my short and long-term goals.',exZh:'作為一個計劃者，我對短期和長期目標都有清晰的路線圖。'},
{w:'envision',zh:'想像；設想',type:'v',ex:'I envision myself working as a digital nomad while traveling the world.',exZh:'我設想自己作為數位遊牧者在環遊世界的同時工作。'},
{w:'digital nomad',zh:'數位遊牧者',type:'phrase',ex:'My dream is to work for a multinational company as a digital nomad.',exZh:'我的夢想是作為數位遊牧者在跨國公司工作。'},
{w:'a tight schedule',zh:'緊湊的行程',type:'phrase',ex:'When planning, I tend to create a tight schedule to avoid wasting any time.',exZh:'在規劃時，我傾向於制定緊湊的行程以避免浪費任何時間。'},
{w:'flexible schedule',zh:'彈性行程',type:'phrase',ex:'In practice, I prefer a flexible schedule so I do not feel pressed for time.',exZh:'在實際操作中，我更喜歡彈性行程，這樣我不會感到時間緊迫。'},
{w:'be pressed for time',zh:'時間緊迫',type:'phrase',ex:'I always feel pressed for time during exam season.',exZh:'在考試季節，我總是感到時間緊迫。'},
{w:'disciplined',zh:'自律的',type:'adj',ex:'Teaching children to follow a schedule helps them become more disciplined.',exZh:'教孩子遵守時間表有助於他們變得更自律。'},
{w:'excess screen time',zh:'過多的螢幕時間',type:'phrase',ex:'Excess screen time can negatively affect children\'s social development.',exZh:'過多的螢幕時間會對兒童的社會發展產生負面影響。'},
{w:'go according to plan',zh:'按計畫進行',type:'phrase',ex:'I get frustrated when things do not go according to plan.',exZh:'當事情不按計畫進行時，我會感到沮喪。'},
],sentences:[
{en:'Back then, I had plenty of time to kill time mindlessly.',zh:'那時候，我有大把時間漫無目的地打發時間。'},
{en:'As a senior student, my schedule is much tighter now.',zh:'作為大四學生，我現在的行程緊湊得多了。'},
{en:'I have to manage my time effectively to find any gaps for relaxation.',zh:'我必須有效管理時間，才能找到任何放鬆的空檔。'},
{en:'Most people tend to engage in social media or outdoor activities like hiking.',zh:'大多數人傾向於使用社交媒體或從事戶外活動，例如遠足。'},
{en:"There's a growing trend of young people seeking me-time in quiet places.",zh:'越來越多年輕人尋求在安靜的地方享有獨處時間的趨勢。'},
{en:'They want to take a break from work and recharge.',zh:'他們想從工作中休息並恢復精力。'},
{en:'Rest is absolutely crucial to stay productive in the long run.',zh:'從長遠來看，休息對於保持生產力絕對關鍵。'},
{en:"It's all about finding a perfect balance between chasing goals and enjoying life.",zh:'這一切都是關於在追求目標和享受生活之間找到完美的平衡。'},
{en:'In the past, I used to kill time by mindlessly scrolling through social media.',zh:'在過去，我習慣漫無目的地刷社交媒體打發時間。'},
{en:"As my life became busier, I realized I shouldn't waste my time like that.",zh:'隨著生活變得更忙碌，我意識到我不應該那樣浪費時間。'},
{en:'Now I prefer to enrich myself during my spare time.',zh:'現在我更喜歡在空閒時間充實自己。'},
{en:'I listen to podcasts, research the stock market, or memorize English vocabulary.',zh:'我聆聽播客、研究股市或背誦英語詞彙。'},
{en:'I usually make use of fragmented time throughout my day.',zh:'我通常充分利用一天中的碎片化時間。'},
{en:'I listen to book-summary podcasts while doing my makeup or taking a shower.',zh:'我在化妝或淋浴時聆聽書籍摘要播客。'},
{en:'I practice vocabulary on my way to class or meals.',zh:'我在去上課或用餐的途中練習詞彙。'},
{en:'This makes me feel productive even during short breaks.',zh:'這讓我即使在短暫的休息中也感到有生產力。'},
{en:'During longer breaks, I unwind by visiting cafes for afternoon tea.',zh:'在較長的休息時間，我去咖啡館喝下午茶來放鬆。'},
{en:'I also unwind by watching classic movies at home.',zh:'我也藉由在家看經典電影來放鬆。'},
{en:'Most of the time, I prefer to be alone.',zh:'大多數時候，我更喜歡獨處。'},
{en:"I'm a person who needs solitude to recharge my batteries.",zh:'我是一個需要獨處來恢復精力的人。'},
{en:'These small moments of relaxation add a touch of quality to my busy life.',zh:'這些小小的放鬆時刻為我忙碌的生活增添了一份品質。'},
{en:'My time feels both well-spent and meaningful.',zh:'我的時間感覺既花得值得又有意義。'},
{en:"I'm a firm believer that making plans in advance is essential for achieving goals.",zh:'我堅定地相信提前規劃對於實現目標至關重要。'},
{en:'It helps me prioritize tasks and keep my daily schedule manageable.',zh:'它幫助我優先處理任務並保持每日行程可管理。'},
{en:'I often struggle with laziness and procrastination.',zh:'我常常與懶惰和拖延作鬥爭。'},
{en:'They prevent me from staying on track.',zh:'它們阻止我保持正軌。'},
{en:'I try to manage my time effectively even when I sometimes fail.',zh:'即使有時失敗，我也嘗試有效地管理時間。'},
{en:"When things don't go according to plan, I tend to get frustrated and feel paralysed.",zh:'當事情不按計畫進行時，我往往會感到沮喪甚至不知所措。'},
{en:'I eventually regroup and adjust my schedule.',zh:'我最終重整旗鼓並調整我的行程。'},
{en:'I tend to create a tight schedule to avoid wasting a single second.',zh:'我傾向於制定緊湊的行程，以避免浪費一秒鐘。'},
{en:"In practice, I prefer a flexible schedule so I don't feel pressed for time.",zh:'在實際操作中，我更喜歡彈性行程，這樣我不會感到時間緊迫。'},
{en:'By incorporating breaks into my schedule, I can actually stick to it more effectively.',zh:'通過在行程中加入休息時間，我實際上可以更有效地堅持執行它。'},
{en:'Among all types of plans, travel itineraries are usually my most successful.',zh:'在所有類型的計畫中，旅行行程通常是我最成功的。'},
{en:'I have a passion for organizing every detail, from routes to the timing of each spot.',zh:'我熱衷於組織每個細節，從路線到每個景點的時間安排。'},
{en:'When everything is executed perfectly as planned, it gives me a great sense of satisfaction.',zh:'當一切都按計畫完美執行時，它給了我巨大的滿足感。'},
{en:'I vividly remember arranging trips during my exchange program in France last year.',zh:'我清晰地記得去年在法國交換期間安排旅行的情景。'},
{en:'Over six months, I managed to visit fifteen different European countries.',zh:'在六個月內，我設法訪問了十五個不同的歐洲國家。'},
{en:'Planning the daily itineraries helped me gain a better understanding of local geography and culture.',zh:'規劃每日行程幫助我更好地了解當地的地理和文化。'},
{en:'The process itself made me look forward to the journey even more.',zh:'這個過程本身讓我更加期待旅程。'},
{en:'As a person who firmly believes planning is essential, I have a clear roadmap for my future.',zh:'作為一個堅定相信規劃重要性的人，我對未來有清晰的路線圖。'},
{en:"I've divided my future plan into three main stages.",zh:'我把未來的計畫分為三個主要階段。'},
{en:'In the short term, my priority is to finish my graduation project.',zh:'在短期內，我的首要任務是完成我的畢業專題。'},
{en:'I also want to achieve an outstanding IELTS score to apply for my master\'s degree.',zh:'我還想取得優異的雅思成績以申請碩士學位。'},
{en:'Following that, I plan to spend two years diving into neuroscience.',zh:'在那之後，我計劃花兩年時間深入研究神經科學。'},
{en:"I'm looking for internships in relevant labs or companies.",zh:'我正在尋找相關實驗室或公司的實習機會。'},
{en:"I'm preparing by improving my time management and avoiding procrastination.",zh:'我正在通過改善時間管理和避免拖延來做準備。'},
{en:'My dream is to work for a multinational company as a digital nomad.',zh:'我的夢想是作為數位遊牧者在跨國公司工作。'},
{en:'I envision myself traveling with my laptop and exploring the world while I work.',zh:'我設想自己帶著筆記型電腦旅行，在工作的同時探索世界。'},
{en:"It's about balancing my career and freedom.",zh:'這是關於平衡我的職業和自由。'},
{en:'Completing my tasks gives me a great sense of accomplishment.',zh:'完成我的任務給了我巨大的成就感。'},
{en:"Honestly, I don't think children have a lot of responsibilities.",zh:'說實話，我不認為兒童有很多責任。'},
{en:'So I guess they have plenty of time to explore their interests and develop useful skills.',zh:'所以我猜他們有大量時間探索興趣並培養有用的技能。'},
{en:"Excessive screen time can have negative effects on people's social lives.",zh:'過多的螢幕時間會對人們的社交生活產生負面影響。'},
{en:'They may become less interactive with others in person.',zh:'他們可能變得不那麼善於與他人面對面互動。'},
{en:'My brother spent most of his time playing video games and could hardly stop.',zh:'我弟弟大部分時間都在玩電子遊戲，幾乎無法停下來。'},
{en:'Over time, it became an addiction.',zh:'隨著時間的推移，它變成了一種上癮。'},
{en:'Now he struggles to communicate with others effectively.',zh:'現在他很難有效地與他人溝通。'},
]},
{id:'vocab_bank',name:'Vocabulary Bank',emoji:'📚',words:[
{w:'fill their lives',zh:'填滿他們的生活',type:'phrase',ex:'Pets fill their lives with joy and unconditional love every single day.',exZh:'寵物每天都用快樂和無條件的愛填滿他們的生活。'},
{w:'only exception',zh:'唯一的例外',type:'phrase',ex:'I never eat dessert — the only exception is my grandmother\'s homemade cake.',exZh:'我從不吃甜點——唯一的例外是我祖母的自製蛋糕。'},
{w:'creep me out',zh:'讓我毛骨悚然',type:'phrase',ex:'Those realistic robot faces really creep me out every time I see them.',exZh:'那些逼真的機器人臉每次我看到都讓我毛骨悚然。'},

{w:'captivated by',zh:'被...深深吸引',type:'phrase',ex:'I was completely captivated by her storytelling from the very first sentence.',exZh:'從第一句話開始，我就完全被她的講故事方式所吸引。'},

{w:'add a touch of',zh:'增添一點',type:'phrase',ex:'She added a touch of lemon to the sauce to brighten the flavour.',exZh:'她在醬汁中加入了一點檸檬，讓味道更加鮮亮。'},
{w:"boost someone's mood",zh:'提振某人的心情',type:'phrase',ex:'A surprise coffee from a friend can really boost someone\'s mood on a tough day.',exZh:'在艱難的一天裡，朋友送來的一杯驚喜咖啡真的能提振心情。'},
{w:'making fun out of',zh:'從...中找樂趣',type:'phrase',ex:'He has a talent for making fun out of everyday situations.',exZh:'他有一種從日常情境中找到樂趣的天賦。'},
{w:'firm believer',zh:'堅定的信奉者',type:'phrase',ex:'She is a firm believer that consistency matters more than talent.',exZh:'她堅定相信持之以恆比天賦更重要。'},
{w:'a means to an end',zh:'達到目的的手段',type:'phrase',ex:'For him, the part-time job was just a means to an end while he finished his degree.',exZh:'對他來說，兼職工作只是完成學業期間的一種達成目的的手段。'},
{w:'attention drawn to',zh:'注意力被吸引到',type:'phrase',ex:'My attention was drawn to the small painting in the corner of the gallery.',exZh:'我的注意力被畫廊角落裡的那幅小畫所吸引。'},
{w:'goes toward',zh:'用於；花費在',type:'phrase',ex:'Most of my salary goes toward rent and daily expenses.',exZh:'我大部分的薪水都用於房租和日常開銷。'},
{w:'serves as a form of',zh:'作為一種...的形式',type:'phrase',ex:'Journaling serves as a form of therapy for many people dealing with stress.',exZh:'對許多承受壓力的人來說，寫日記是一種治療方式。'},
{w:'passionate',zh:'充滿熱情的',type:'adj',ex:'She is passionate about teaching and never misses a chance to inspire her students.',exZh:'她對教學充滿熱忱，從不放過任何激勵學生的機會。'},
{w:'humid',zh:'潮濕的',type:'adj',ex:'It was so humid outside that my glasses fogged up immediately.',exZh:'外面非常潮濕，我的眼鏡立刻就起霧了。'},
{w:'scorching',zh:'灼熱的',type:'adj',ex:'We stayed indoors to avoid the scorching afternoon sun.',exZh:'我們待在室內，以避開灼熱的午後陽光。'},
{w:'hospitality',zh:'熱情款待',type:'n',ex:'The hospitality of the local people made our trip truly unforgettable.',exZh:'當地人的熱情款待讓我們的旅程真正難以忘懷。'},
{w:'furious',zh:'狂怒的',type:'adj',ex:'He was furious when he found out his project had been cancelled without warning.',exZh:'當他發現自己的專案在毫無預警的情況下被取消時，他勃然大怒。'},
{w:'disrespectful',zh:'不尊重的',type:'adj',ex:'It\'s disrespectful to talk loudly on your phone during a meeting.',exZh:'在開會時大聲講電話是不尊重他人的行為。'},
{w:'distinctive',zh:'獨特的；有特色的',type:'adj',ex:'Her distinctive laugh made her easy to spot across the room.',exZh:'她那獨特的笑聲讓她在房間裡很容易被認出。'},
{w:'stand out',zh:'顯眼；脫穎而出',type:'v',ex:'Her red coat made her stand out in the crowd of grey winter jackets.',exZh:'她的紅色外套讓她在一片灰色冬季外套的人群中非常顯眼。'},
{w:'identical',zh:'完全相同的',type:'adj',ex:'The two sisters wore identical outfits to the party as a joke.',exZh:'這對姐妹穿著相同的服裝去派對，只是為了開個玩笑。'},
{w:'deliberately',zh:'故意地；刻意地',type:'adv',ex:'She deliberately arrived early to get a good seat at the front.',exZh:'她故意早到，以便在前排找到一個好位置。'},
{w:'astonishing',zh:'令人驚嘆的',type:'adj',ex:'The magician\'s final trick was absolutely astonishing — nobody could figure it out.',exZh:'魔術師的最後一個把戲真是令人嘆為觀止——沒有人能看穿。'},
{w:'authentic',zh:'真正的；道地的',type:'adj',ex:'This restaurant serves authentic Thai food made with imported ingredients.',exZh:'這家餐廳提供用進口食材製作的真正泰國料理。'},

function lsGet(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let prog;try{prog=JSON.parse(lsGet('wf2_prog','{}'))}catch(e){prog={}}
let score=parseInt(lsGet('wf2_score','0'));
let streak=parseInt(lsGet('wf2_streak','0'));
const today=new Date().toDateString();
let todayDone=parseInt(lsGet('wf2_td_'+today,'0'));
let todayCorrect=parseInt(lsGet('wf2_tc_'+today,'0'));
let todayTotal=parseInt(lsGet('wf2_tt_'+today,'0'));
let todayWordDone=parseInt(lsGet('wf2_twd_'+today,'0'));  // word questions done today
let todaySentDone=parseInt(lsGet('wf2_tsd_'+today,'0'));  // sentence questions done today
const WORD_GOAL=30;
const SENT_GOAL=20;

// Week key: Mon-Sun
function getWeekKey(){const d=new Date();const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));return'wk_'+mon.toDateString();}
let weekKey=getWeekKey();
let weekNewWords=parseInt(lsGet('wf2_wnw_'+weekKey,'0'));
let weekNewSents=parseInt(lsGet('wf2_wns_'+weekKey,'0'));

// Unit accuracy: {unitId: {correct:0, total:0}}
let unitAcc;try{unitAcc=JSON.parse(lsGet('wf2_uacc','{}'))}catch(e){unitAcc={}}

function saveAll(){lsSet('wf2_prog',JSON.stringify(prog));lsSet('wf2_score',score);lsSet('wf2_streak',streak);lsSet('wf2_uacc',JSON.stringify(unitAcc));}
function saveTd(){
  lsSet('wf2_td_'+today,todayDone);
  lsSet('wf2_tc_'+today,todayCorrect);
  lsSet('wf2_tt_'+today,todayTotal);
  lsSet('wf2_twd_'+today,todayWordDone);
  lsSet('wf2_tsd_'+today,todaySentDone);
  lsSet('wf2_wnw_'+weekKey,weekNewWords);
  lsSet('wf2_wns_'+weekKey,weekNewSents);
}

function recordAnswer(ok, unitId){
  todayTotal++;
  if(ok) todayCorrect++;
  if(unitId){
    if(!unitAcc[unitId])unitAcc[unitId]={correct:0,total:0};
    unitAcc[unitId].total++;
    if(ok)unitAcc[unitId].correct++;
  }
}
function wp(uid,w){const k=uid+'__'+w;if(!prog[k])prog[k]={mc:0,fi:0};return prog[k];}
function sp(uid,i){const k=uid+'__s'+i;if(!prog[k])prog[k]={jig:0,typ:0};if(prog[k].c!==undefined){prog[k].jig=prog[k].c;prog[k].typ=0;delete prog[k].c;}return prog[k];}
function isMastered(uid,w){const p=wp(uid,w);return p.mc>=2&&p.fi>=2;}
function isSentDone(uid,i){const p=sp(uid,i);return p.jig>=2&&p.typ>=2;}

function calcGoal(){
  let rem=0;
  UNITS.forEach(u=>{
    u.words.forEach(w=>{const p=wp(u.id,w.w);rem+=Math.max(0,2-p.mc)+Math.max(0,2-p.fi);});
    u.sentences.forEach((_,i)=>{const p=sp(u.id,i);rem+=Math.max(0,2-p.jig)+Math.max(0,2-p.typ);});
  });
  return Math.ceil(rem/7);
}

function switchTab(p,el){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));

  el.classList.add('on');
  if(p==='words'){renderWB();document.getElementById('wordQuizArea').style.display='none';}
  if(p==='sentences')initSentTab();
  if(p==='practice'&&document.getElementById('topicListView').style.display!=='none')renderTopics();
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
function escR(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function showPop(t){const el=document.getElementById('scorePop');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function speak(t,d){
  const go=()=>{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US';u.rate=0.82;u.pitch=1.0;
    // Pick best available voice: prefer Daniel (UK), Karen (AU), Samantha (US)
    const voices=speechSynthesis.getVoices();
    const preferred=['Daniel','Karen','Samantha','Google US English','Microsoft Aria'];
    const pick=preferred.map(n=>voices.find(v=>v.name.includes(n))).find(Boolean)
      ||voices.find(v=>v.lang==='en-US'&&v.localService)
      ||voices.find(v=>v.lang.startsWith('en'));
    if(pick)u.voice=pick;
    speechSynthesis.speak(u);
  };
  // Wait for voices to load on first call
  if(speechSynthesis.getVoices().length===0){
    speechSynthesis.onvoiceschanged=()=>{ if(d)setTimeout(go,d); else go(); speechSynthesis.onvoiceschanged=null; };
  } else { d?setTimeout(go,d):go(); }
}
function sound(type){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();if(type==='ok'){[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';const t=ctx.currentTime+i*.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.33);});}else{[300,220].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='square';const t=ctx.currentTime+i*.22;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19);});}}catch(e){}}

function updateHeader(){
  document.getElementById('hScore').textContent=score;
  document.getElementById('hStreak').textContent=streak;
  // Accuracy
  const accEl=document.getElementById('statAccNum');
  if(accEl&&todayTotal>0){
    const pct=Math.round(todayCorrect/todayTotal*100);
    accEl.textContent=pct+'%';
    accEl.style.color=pct>=80?'var(--accent3)':pct>=60?'var(--accent)':'var(--accent2)';
  }
  // Word bar
  const wdn=document.getElementById('wordDoneNum');const wb=document.getElementById('wordBar');
  if(wdn)wdn.textContent=todayWordDone;
  if(wb){wb.style.width=Math.min(100,todayWordDone/WORD_GOAL*100)+'%';if(todayWordDone>=WORD_GOAL)wb.style.background='var(--accent3)';}

  if(wgs){if(todayWordDone>=WORD_GOAL)wgs.textContent='Goal reached! 🎉';else if(todayWordDone>0)wgs.textContent=(WORD_GOAL-todayWordDone)+' to go';}

  if(sb){sb.style.width=Math.min(100,todaySentDone/SENT_GOAL*100)+'%';if(todaySentDone>=SENT_GOAL)sb.style.background='var(--accent3)';}
}

function renderTopics(){
  const goal=calcGoal();
  updateHeader();


  // Accuracy stat
  const accEl=document.getElementById('statAccNum');
  if(accEl){
    if(todayTotal>0){
      const pct=Math.round(todayCorrect/todayTotal*100);
      accEl.textContent=pct+'%';
      accEl.style.color=pct>=80?'var(--accent3)':pct>=60?'var(--accent)':'var(--accent2)';
    }else{accEl.textContent='—';}
  }

  // Count mastered words this week (approximation: total mastered across all units)
  let totalMasteredWords=0,totalMasteredSents=0;
  UNITS.forEach(u=>{
    totalMasteredWords+=u.words.filter(w=>isMastered(u.id,w.w)).length;
    totalMasteredSents+=u.sentences.filter((_,i)=>isSentDone(u.id,i)).length;
  });
  const nwEl=document.getElementById('statNewWords');if(nwEl)nwEl.textContent=totalMasteredWords;
  const nsEl=document.getElementById('statNewSents');if(nsEl)nsEl.textContent=totalMasteredSents;

  const grid=document.getElementById('topicGrid');
  grid.innerHTML=UNITS.map(u=>{
    const tw=u.words.length,mw=u.words.filter(w=>isMastered(u.id,w.w)).length;
    const ts=u.sentences.length,ms=u.sentences.filter((_,i)=>isSentDone(u.id,i)).length;
    const tot=tw+ts,mas=mw+ms,pct=tot?Math.round(mas/tot*100):0;
    const r=18,circ=2*Math.PI*r,off=circ-(pct/100)*circ;
    // Unit accuracy
    const ua=unitAcc[u.id];
    const uaStr=ua&&ua.total>0?Math.round(ua.correct/ua.total*100)+'% accuracy':'';
    const uaColor=ua&&ua.total>0?(ua.correct/ua.total>=0.8?'var(--accent3)':ua.correct/ua.total>=0.6?'var(--accent)':'var(--accent2)'):'var(--text3)';
    return `<div class="topic-card" onclick="startUnit('${u.id}')">
      <div>
        <div class="topic-emoji">${u.emoji}</div>
        <div class="topic-name">${u.name}</div>
        <div class="topic-meta">${mw}/${tw} words · ${ms}/${ts} sentences</div>
        ${uaStr?`<div style="font-size:11px;font-weight:700;color:${uaColor};margin-top:4px">${uaStr}</div>`:''}
      </div>
      <div class="ring-wrap"><svg width="44" height="44" viewBox="0 0 44 44"><circle class="ring-bg" cx="22" cy="22" r="${r}"/><circle class="ring-fill" cx="22" cy="22" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg><div class="ring-text">${pct}%</div></div>
    </div>`;
  }).join('');
}

let CU=null,queue=[],CI=null,pAnswered=false,hintCnt=0,slots=[],selSlot=null,jHints=5;

function startUnit(uid){
  CU=UNITS.find(u=>u.id===uid);
  document.getElementById('practiceUnitName').textContent=CU.name;
  document.getElementById('topicListView').style.display='none';
  document.getElementById('practiceView').style.display='block';
  buildQ();nextQ();
}
function backToTopics(){
  document.getElementById('topicListView').style.display='block';
  document.getElementById('practiceView').style.display='none';
  renderTopics();
}

function buildQ(){
  queue=[];
  CU.words.forEach(w=>{
    const p=wp(CU.id,w.w);
    for(let i=p.mc;i<2;i++)queue.push({type:'wmc',word:w});
  });
  CU.words.forEach(w=>{
    const p=wp(CU.id,w.w);
    if(p.mc>=2)for(let i=p.fi;i<2;i++)queue.push({type:'wfi',word:w});
  });
  CU.sentences.forEach((s,i)=>{
    const p=sp(CU.id,i);
    if(p.c<1)queue.push({type:'sjig',sent:s,idx:i});
    if(p.c<2)queue.push({type:'styp',sent:s,idx:i});
  });
  // light shuffle within each group
  queue.sort(()=>Math.random()-.5);
}

function nextQ(){
  if(queue.length===0){
    document.getElementById('practiceArea').innerHTML=`<div class="complete-card"><h2>Unit Complete! 🎉</h2><p>All words and sentences mastered.</p><button onclick="backToTopics()" style="background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">Back to Units</button></div>`;
    return;
  }
  CI=queue.shift();pAnswered=false;hintCnt=0;slots=[];selSlot=null;jHints=5;
  if(CI.type==='wmc')renderWMC();
  else if(CI.type==='wfi')renderWFI();
  else if(CI.type==='sjig')renderSJig();
  else renderSTyp();
}

function dots(mc,fi){
  return[0,1,2,3].map(i=>{
    let c='pdot';
    if(i<2){if(i<mc)c+=' done';else if(i===mc)c+=' active';}
    else{const j=i-2;if(j<fi)c+=' done';else if(j===fi&&mc>=2)c+=' active';}
    return`<div class="${c}"></div>`;
  }).join('');
}

async function fetchFreshExFI(w){
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:200,
      messages:[{role:'user',content:'Write ONE natural English sentence (10-18 words) using the word/phrase: "'+w.w+'". The word must appear exactly as written. Then on a new line write the Traditional Chinese translation. Format:\nENGLISH: [sentence]\nCHINESE: [translation]'}]
    })});
    const data=await res.json();
    const raw=(data.content?.[0]?.text||'').trim();
    const enMatch=raw.match(/ENGLISH:\s*(.+)/);
    const zhMatch=raw.match(/CHINESE:\s*(.+)/);
    const ex=enMatch?enMatch[1].trim():raw.split('\n')[0].trim();
    const zh=zhMatch?zhMatch[1].trim():'';
    if(ex&&CI&&CI.word&&CI.word.w===w.w){
      const b=document.getElementById('fiiSentBox');
      if(b){b.textContent=ex.replace(new RegExp(escR(w.w),'gi'),'______');}
      const szhEl=document.getElementById('szh');
      if(szhEl&&zh){szhEl.textContent=zh;}
      CI.freshEx=ex;CI.freshExZh=zh;
    }
  }catch(e){/* fallback: keep stored sentence */}
}

async function fetchFreshEx(w){

      model:'claude-sonnet-4-20250514',max_tokens:200,
      messages:[{role:'user',content:'Write ONE natural English sentence (10-18 words) using the word/phrase: "'+w.w+'". The word must appear exactly as written. Then on a new line write the Traditional Chinese translation of that sentence. Format:\nENGLISH: [sentence]\nCHINESE: [translation]'}]
    })});
    const data=await res.json();
    const raw=(data.content?.[0]?.text||'').trim();
    const enMatch=raw.match(/ENGLISH:\s*(.+)/);
    const zhMatch=raw.match(/CHINESE:\s*(.+)/);
    const ex=enMatch?enMatch[1].trim():raw.split('\n')[0].trim();
    const zh=zhMatch?zhMatch[1].trim():'';
    if(ex&&CI&&CI.word&&CI.word.w===w.w){
      const b=document.getElementById('mcSentBox');

    const b=document.getElementById('mcSentBox');
    if(b){b.innerHTML=w.ex.replace(new RegExp(escR(w.w),'gi'),'<span class="blank"></span>');}
  }
}

  if(ok){sound('ok');speak(correct,600);fb.className='feedback ok';fb.textContent=['Correct! ✨','Perfect! 🎉','Great job!'][Math.floor(Math.random()*3)];
    const p=wp(CU.id,correct);p.mc=Math.min(2,p.mc+1);score+=10+streak;streak++;todayDone++;todayWordDone++;recordAnswer(true,CU?.id);if(p.mc===1&&p.fi===0)weekNewWords++;saveTd();showPop('+'+(10+Math.max(0,streak-1)));updateHeader();
    if(p.mc>=2&&p.fi>=2)document.getElementById('mb').classList.add('show');
  }else{sound('bad');speak(correct,600);fb.className='feedback bad';fb.innerHTML=`<b style="color:var(--accent2)">${escH(correct)}</b>`;streak=0;todayDone++;saveTd();updateHeader();}
  saveAll();document.getElementById('nb').classList.add('show');
}

  if(sb2){sb2.style.width=Math.min(100,todaySentDone/SENT_GOAL*100)+'%';if(todaySentDone>=SENT_GOAL)sb2.style.background='var(--accent3)';}
  const gs2=document.getElementById('sentGoalStatus');
  if(gs2){if(todaySentDone>=SENT_GOAL)gs2.textContent='Goal reached! 🎉';else gs2.textContent=(SENT_GOAL-todaySentDone)+' to go';}
  renderSentListArea([stCI.unit]);
  const nb=document.getElementById('stnb');if(nb)nb.classList.add('show');
}

function renderStTyp(){
  const s=stCI.sent;
  const p=sp(stCI.unit.id,stCI.idx);
  const progTxt=stQueue.length+' remaining';
  document.getElementById('sentPracticeArea').innerHTML=`<div class="qcard">
    <div class="qcard-top">
      <span class="badge" style="background:rgba(196,129,58,.12);color:var(--accent);border:1px solid rgba(196,129,58,.25)">✏️ Write it out</span>
      <span style="font-size:11px;color:var(--text3)">${progTxt}</span>
    </div>
    <div style="font-size:14px;font-weight:600;line-height:1.6;margin-bottom:14px;color:var(--text)">${escH(s.zh)}</div>
    <textarea class="sent-typing" id="stTypInput" placeholder="Write the full English sentence…" oninput="stTypCh()"></textarea>
    <div id="stTypSzh" style="display:none;font-size:12px;color:var(--text3);padding:4px 14px 8px;margin-top:-4px;line-height:1.5;font-style:italic">${escH(s.en)}</div>
    <div class="hint-row" style="margin-top:8px">
      <button class="hint-btn" id="stTypHb" onclick="stTypHint()">💡 Hint (first 3 words)</button>
      <button class="skip-btn" onclick="chkStTyp(true)">❌ Skip</button>
    </div>
    <button class="check-btn" id="stTypCb" onclick="chkStTyp(false)" disabled style="width:100%;margin-top:10px">Check ✓</button>
    <div class="feedback" id="stTypFb"></div>
    <div class="sent-zh-reveal" id="stTypZh"></div>
    <button class="next-btn" id="stTypNb" onclick="nextStQ()">Next →</button>
  </div>`;
  setTimeout(()=>document.getElementById('stTypInput')?.focus(),80);
}
function stTypCh(){const v=document.getElementById('stTypInput')?.value.trim();document.getElementById('stTypCb').disabled=!v;}
function stTypHint(){
  const w=stCI.sent.en.split(' ');
  const inp=document.getElementById('stTypInput');if(inp){inp.placeholder=w.slice(0,3).join(' ')+'…';}
  const hb=document.getElementById('stTypHb');if(hb){hb.disabled=true;hb.style.opacity='.4';}
}
function chkStTyp(skip){
  if(stAns)return;stAns=true;
  const inp=document.getElementById('stTypInput');const val=skip?'':inp?.value.trim()||'';
  if(inp)inp.disabled=true;document.getElementById('stTypCb').disabled=true;
  const hb=document.getElementById('stTypHb');if(hb){hb.disabled=true;hb.style.opacity='.4';}
  const correct=stCI.sent.en;const norm=s=>s.toLowerCase().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
  const ok=!skip&&norm(val)===norm(correct);
  // Always speak full sentence
  speak(correct,500);
  const szh=document.getElementById('stTypZh');if(szh){szh.style.display='block';szh.textContent=stCI.sent.zh;}
  const szh2=document.getElementById('stTypSzh');if(szh2)szh2.style.display='block';
  const fb=document.getElementById('stTypFb');
  if(ok){if(inp)inp.classList.add('correct');sound('ok');fb.className='feedback ok';fb.textContent=['Perfect! 🎉','Nailed it! ✨','Excellent!'][Math.floor(Math.random()*3)];
    const p=sp(stCI.unit.id,stCI.idx);p.typ=Math.min(2,p.typ+1);todaySentDone++;recordAnswer(true,stCI.unit?.id);
  }else{if(inp)inp.classList.add('wrong');sound('bad');fb.className='feedback bad';
    const wp=(!skip&&val)?`<span style="text-decoration:line-through;color:var(--accent2)">${escH(val)}</span><br>`:'';
    fb.innerHTML=wp+`<span style="color:var(--accent2)">${escH(correct)}</span>`;todaySentDone++;recordAnswer(false,stCI.unit?.id);
  }
  saveAll();
  const sdn3=document.getElementById('sentDoneNum');const sb3=document.getElementById('sentBar');
  if(sdn3)sdn3.textContent=todaySentDone;
  if(sb3){sb3.style.width=Math.min(100,todaySentDone/SENT_GOAL*100)+'%';if(todaySentDone>=SENT_GOAL)sb3.style.background='var(--accent3)';}
  const gs3=document.getElementById('sentGoalStatus');
  if(gs3){if(todaySentDone>=SENT_GOAL)gs3.textContent='Goal reached! 🎉';else gs3.textContent=(SENT_GOAL-todaySentDone)+' to go';}
  renderSentListArea([stCI.unit]);
  document.getElementById('stTypNb').classList.add('show');
}

function renderSentListArea(units){
  const el=document.getElementById('sentListArea');if(!el)return;
  el.innerHTML=(units||UNITS).flatMap(u=>u.sentences.map((s,i)=>{
    const done=isSentDone(u.id,i);const p2=sp(u.id,i);
    const prog=done?'✅ Mastered':p2.jig>=2?`Arrange ✓ · Write ${p2.typ}/2`:`Arrange ${p2.jig}/2`;
    return`<div class="sent-item ${done?'mastered':''}"><div class="sent-item-en">${escH(s.en)}</div><div class="sent-item-zh">${escH(s.zh)}</div><div class="sent-item-meta">${u.name} · ${prog}</div></div>`;
  })).join('');
}

// ── WORD BANK QUIZ ───────────────────────────────────
let wqCurrent=null,wqAnswered=false,wqCorrect=0,wqTotal=0;

function startWordQuiz(){
  wqCorrect=0;wqTotal=0;
  document.getElementById('wordQuizArea').style.display='block';
  nextWQ();
}

function nextWQ(){
  // Pick random word from all units
  const all=UNITS.flatMap(u=>u.words.map(w=>({w,u})));
  const item=all[Math.floor(Math.random()*all.length)];
  wqCurrent=item;wqAnswered=false;
  const w=item.w,u=item.u;
  // 4 options: correct zh + 3 distractors
  const others=all.filter(x=>x.w.w!==w.w).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[...others.map(x=>x.w.zh),w.zh].sort(()=>Math.random()-.5);
  const score_txt=wqTotal>0?`${wqCorrect}/${wqTotal} correct`:'';
  document.getElementById('wordQuizArea').innerHTML=`<div class="qcard" style="border-color:var(--purple)">
    <div class="qcard-top">
      <span class="badge" style="background:rgba(124,111,212,.12);color:var(--purple);border:1px solid rgba(124,111,212,.25)">🎯 Word Quiz</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;color:var(--text3)">${score_txt}</span>
        <button onclick="closeWordQuiz()" style="background:none;border:1px solid var(--border);border-radius:100px;padding:4px 12px;font-size:12px;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif">✕ Close</button>
      </div>
    </div>
    <div style="font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:-.5px;margin-bottom:4px">${escH(w.w)}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:18px">${w.type} · ${u.name}</div>
    <div class="opts" id="wqOpts">
      ${opts.map(zh=>`<button class="opt" onclick="chkWQ(this,'${escH(zh)}','${escH(w.zh)}')">${escH(zh)}</button>`).join('')}
    </div>
    <div class="feedback" id="wqfb"></div>
    <button class="next-btn" id="wqnb" onclick="nextWQ()">Next →</button>
  </div>`;
  speak(w.w);
}

function chkWQ(btn,chosen,correct){
  if(wqAnswered)return;wqAnswered=true;wqTotal++;
  const ok=chosen===correct;
  document.querySelectorAll('#wqOpts .opt').forEach(b=>b.disabled=true);
  if(ok){btn.classList.add('correct');wqCorrect++;sound('ok');}
  else{btn.classList.add('wrong');document.querySelectorAll('#wqOpts .opt').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('correct');});sound('bad');}
  const fb=document.getElementById('wqfb');
  fb.className='feedback '+(ok?'ok':'bad');
  fb.textContent=ok?['Correct! ✨','Right! 🎉','Yes!'][Math.floor(Math.random()*3)]:correct;
  document.getElementById('wqnb').classList.add('show');
}

function closeWordQuiz(){
  document.getElementById('wordQuizArea').style.display='none';
}

function renderSL(){renderSentListArea(UNITS);}


function populateSels(){
  ['wbSel','sentSel'].forEach(id=>{
    const sel=document.getElementById(id);
    UNITS.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.name;sel.appendChild(o);});
  });
}

populateSels();
renderTopics();
initSentTab();
</script>
